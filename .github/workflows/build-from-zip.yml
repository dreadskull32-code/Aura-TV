name: Build AURA TV APK from zip
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q AuraTVLauncher.zip -d /tmp/p

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: /tmp/p/AuraTVLauncher
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: AuraTV-debug-apk
          path: /tmp/p/AuraTVLauncher/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp /tmp/p/AuraTVLauncher/app/build/outputs/apk/debug/app-debug.apk AuraTV-Launcher.apk
          gh release create "v1.0.${{ github.run_number }}" AuraTV-Launcher.apk \
            --repo ${{ github.repository }} \
            --title "AURA TV v1.0.${{ github.run_number }}" \
            --notes "Debug build of the AURA TV launcher."
